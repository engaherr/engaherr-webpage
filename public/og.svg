  <text x="1000" y="336" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="11" letter-spacing="1.5" fill="#d0ccd0" fill-opacity="0.8">BUILD / SHIP</text>

